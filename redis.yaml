- name: Configuring redis server

  hosts: redis

  tasks:
    - name: Disabling default version
      command: dnf module disable redis -y
    
    - name: Enabling required version
      command: dnf module enable redis:7 -y
    
    - name: Installing redis
      package:
        name: redis
        state: present

    - name: Replace text in conf
      ansible.builtin.replace:
        path: /etc/redis/redis.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'
    
    - name: Disable Redis protected mode
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^protected-mode'
        line: 'protected-mode no'

    - name: starting redis service
      service:
        name: redis
        state: restarted
        enabled: yes
