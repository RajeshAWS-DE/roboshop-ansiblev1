- name: Creating instances
  hosts: local
  connection: local
  vars: 
    name_of_instances: ["mongodb","mysql","frontend"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: rajesh-lab.shop 
    action: create
    sg_common: roboshop-common
    my_ip: 136.185.89.27/32
    zone: rajesh-lab.shop
  tasks:
    - name: start multiple instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: t3.micro
        image_id: "{{ image_id }}"
        region: us-east-1
        security_groups: 
          - "{{ sg_common }}"
          - "roboshop-{{ item }}"
        tags:
          foo: "roboshop-{{ item }}"
      loop: "{{ name_of_instances }}"
      register: ec2_output
      when: action=="create"
      tags:
        - R53

    - name: Use a routing policy to distribute traffic
      amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        record: "{{ item.item }}.{{ zone }}"
        type: A
        value: "{{ item.instances[0].private_ip_address }}"
        ttl: 1
      loop: "{{ ec2_output.results }}"
      when: 
        - item.item != "frontend"
        - action= "create"
      tags: 
        - R53

    - name: Use a routing policy to distribute traffic
      amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        record: "{{ zone }}"
        type: A
        value: "{{ item.instances[0].private_ip_address }}"
        ttl: 1
      loop: "{{ ec2_output.results }}"
      when: 
        - item.item == "frontend"
        - action= "create"
      tags: 
        - R53
      
    - name: Deleting multiple instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        state: absent
        region: us-east-1
      loop: "{{ instances }}"
      when: action=="delete"


