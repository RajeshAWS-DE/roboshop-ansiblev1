- name: Creating instances
  hosts: local
  connection: local
  vars: 
    name_of_instances: ["mongodb","redis","mysql"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: rajesh-lab.shop 
    action: create
    sg_common: roboshop-common
    my_ip: 136.185.89.27/32
  tasks:
    - name: start multiple instances
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        image_id: "{{ image_id }}"
        vpc_subnet_id: vpc-0b1b30f3a7a88e567
        region: us-east-1
        security_groups: 
          - "{{ sg_common }}"
          - "roboshop-{{ item }}"
        tags:
          foo: "roboshop-{{ item }}"
      loop: "{{ name_of_instances }}"
      register: ec2_output
      when: action=="create"
    
    - name: Printing ec2_output
      debug:
        msg: "{{ ec2_output }}"


